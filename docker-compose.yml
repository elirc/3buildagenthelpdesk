services:
  postgres:
    image: postgres:16-alpine
    container_name: agentdesk-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentdesk
    ports:
      # Host port 5462, not 5432. A developer machine usually has several
      # projects with their own Postgres, and the first one started wins
      # the default port — the rest fail with "port is already allocated".
      # Giving this project a dedicated host port means it can run
      # alongside the others instead of competing with them.
      #
      # Only the host side moves. Inside the container Postgres still
      # listens on 5432, so nothing about the image or its config changes.
      - "5462:5432"
    volumes:
      - agentdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentdesk-postgres-data:
